[project]
name = "creativity-service"
version = "0.1.0"
description = "一玄智能平台服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135,<0.143",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "uvicorn[standard]>=0.41,<0.50",
  "sqlalchemy[asyncio]>=2.0.48,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.3,<4",
  "redis>=6.4,<8",
  "celery[redis]>=5.6,<6",
  "boto3>=1.42,<2",
  "cryptography>=46,<51",
  "jsonschema>=4.26,<5",
  "httpcore>=1.0.9,<2",
  "litellm==1.96.2",
  "langgraph>=1.0,<2",
  "mcp>=1.26,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
  "opentelemetry-instrumentation-celery>=0.60b0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
  "mypy>=1.19,<2",
  "boto3-stubs[s3]>=1.42,<2",
  "types-jsonschema>=4.26,<5",
  "pip-audit>=2.10,<3",
]

[project.scripts]
creativity-api = "creativity_service.cli:main"
creativity-openapi = "creativity_service.api.openapi:main"
creativity-iam = "creativity_service.modules.iam.cli:main"
creativity-channels = "creativity_service.modules.channels.cli:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.10.12"

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["opentelemetry.instrumentation.celery"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "opentelemetry.instrumentation.celery"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = ["integration: 需要本地 PostgreSQL、Redis、对象存储及 Worker 的集成验证"]
