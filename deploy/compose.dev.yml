name: creativity-dev

services:
  mysql:
    image: mysql:8.0.45
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_PASSWORD:?请设置开发数据库密码}
      MYSQL_DATABASE: ${DEV_MYSQL_DB:-creativity}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin", "--transaction-isolation=READ-COMMITTED"]
    ports:
      - "127.0.0.1:${DEV_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${DEV_REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi'
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${CREATIVITY_S3_ACCESS_KEY_ID:?请设置本地对象存储账号}
      MINIO_ROOT_PASSWORD: ${CREATIVITY_S3_SECRET_ACCESS_KEY:?请设置本地对象存储密码}
    ports:
      - "127.0.0.1:${DEV_S3_PORT:-59000}:9000"
      - "127.0.0.1:${DEV_S3_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_USER: ${CREATIVITY_S3_ACCESS_KEY_ID}
      S3_PASSWORD: ${CREATIVITY_S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${CREATIVITY_S3_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_USER" "$$S3_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"

volumes:
  mysql-data:
  redis-data:
  minio-data:
