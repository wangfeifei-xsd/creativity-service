name: creativity-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:?请复制并配置 .env}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?请设置开发数据库密码}
      POSTGRES_DB: ${DEV_POSTGRES_DB:?请设置开发数据库名称}
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${CREATIVITY_S3_ACCESS_KEY_ID:?请设置本地对象存储账号}
      MINIO_ROOT_PASSWORD: ${CREATIVITY_S3_SECRET_ACCESS_KEY:?请设置本地对象存储密码}
    ports:
      - "127.0.0.1:${DEV_S3_PORT:-59000}:9000"
      - "127.0.0.1:${DEV_S3_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_USER: ${CREATIVITY_S3_ACCESS_KEY_ID}
      S3_PASSWORD: ${CREATIVITY_S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${CREATIVITY_S3_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_USER" "$$S3_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"

volumes:
  postgres-data:
  redis-data:
  minio-data:
