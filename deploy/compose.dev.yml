name: creativity-dev

services:
  mysql:
    image: mysql:8.0.45
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_PASSWORD:?请设置开发数据库密码}
      MYSQL_DATABASE: ${DEV_MYSQL_DB:-creativity}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin", "--transaction-isolation=READ-COMMITTED"]
    ports:
      - "127.0.0.1:${DEV_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${DEV_REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi'
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
